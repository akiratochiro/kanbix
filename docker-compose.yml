# Padrão (`docker compose up`): só o Postgres, para rodar a API/Web com
#   `npm run dev`.
# Stack completa em containers: `docker compose --profile full up --build`
#   -> web  em  http://localhost:3000
#   -> api  em  http://localhost:3333

services:
  postgres:
    image: postgres:16-alpine
    container_name: kanbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanbix
      POSTGRES_PASSWORD: kanbix_dev_password
      POSTGRES_DB: kanbix
    ports:
      - "5434:5432"
    volumes:
      - kanbix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanbix -d kanbix"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kanbix-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kanbix:kanbix_dev_password@postgres:5432/kanbix?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      PORT: "3333"
    ports:
      - "${API_PORT:-3333}:3333"

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # URL da API vista pelo NAVEGADOR (não pela rede interna).
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3333}/api
    container_name: kanbix-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  kanbix_postgres_data:
